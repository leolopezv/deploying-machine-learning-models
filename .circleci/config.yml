version: 2.1
orbs:
  node: circleci/node@5.1.0
jobs:
  test:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project/section-08-deploying-with-containers/house-prices-api
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: |
            pip install --upgrade pip
            pip install -r test_requirements.txt
      - run:
          name: Run tests
          command: |
            pytest -v
  build_and_push:
    docker:
      - image: cimg/base:2022.10
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.12
      - run:
          name: Build Docker image
          command: |
            docker build \
              --build-arg PIP_EXTRA_INDEX_URL=${PIP_EXTRA_INDEX_URL} \
              -t house-prices-api:${CIRCLE_SHA1:0:7} \
              -t house-prices-api:latest \
              .
      - run:
          name: Push to Docker Hub
          command: |
            echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
            docker tag house-prices-api:${CIRCLE_SHA1:0:7} ${DOCKER_USERNAME}/house-prices-api:${CIRCLE_SHA1:0:7}
            docker tag house-prices-api:latest ${DOCKER_USERNAME}/house-prices-api:latest
            docker push ${DOCKER_USERNAME}/house-prices-api:${CIRCLE_SHA1:0:7}
            docker push ${DOCKER_USERNAME}/house-prices-api:latest
  deploy_to_railway:
    docker:
      - image: cimg/base:2022.10
    steps:
      - checkout
      - node/install:
          node-version: '18.0'
      - run:
          name: Install Railway CLI
          command: npm install -g @railway/cli
      - run:
          name: Deploy to Railway
          command: |
            railway up --detach
          environment:
            RAILWAY_TOKEN: ${RAILWAY_TOKEN}
workflows:
  version: 2
  build_test_deploy:
    jobs:
      - test:
          filters:
            branches:
              only: /.*/
      - build_and_push:
          requires:
            - test
          filters:
            branches:
              only:
                - main
                - master
      - deploy_to_railway:
          requires:
            - build_and_push
          filters:
            branches:
              only:
                - main
                - master
